# ---------------------------------------------------------------------------
# rules/run_vep.smk configuration
# ---------------------------------------------------------------------------
var_excel: /storage/mathelierarea/processed/eirikhoy/action_var/data/BRCA1_BRCA2_PALB2_varianter_2025_02_10.xlsx
hgvs: /storage/mathelierarea/processed/eirikhoy/action_var/data/BRCA1_BRCA2_PALB2_varianter_2025_02_10_HGVS.txt
cache_file: /storage/mathelierarea/processed/eirikhoy/action_var/resources/homo_sapiens_refseq_vep_111_GRCh37.tar.gz
cache_url: https://ftp.ensembl.org/pub/release-111/variation/indexed_vep_cache/homo_sapiens_refseq_vep_111_GRCh37.tar.gz
cache_path: /storage/mathelierarea/processed/eirikhoy/action_var/resources/homo_sapiens_refseq/111_GRCh37
vep_out: /storage/mathelierarea/processed/eirikhoy/action_var/results/vep_grch37_output.txt
vep_container: docker://ensemblorg/ensembl-vep:release_111.0
assembly: GRCh37

# ---------------------------------------------------------------------------
# GWAS Catalog fetch configuration
# ---------------------------------------------------------------------------
gwas_catalog:
  traits:
    - "breast carcinoma"
    - "breast cancer"

  output_dir: "results/gwas_catalog"
  base_url: "https://www.ebi.ac.uk/gwas/rest/api"
  page_size: 200
  request_sleep_seconds: 0.1
  p_value_threshold: 5.0e-8


# ---------------------------------------------------------------------------
# Modules to run
# ---------------------------------------------------------------------------
modules:
#  - process_variants
# - gwas_catalog
# - hgvs2vcf
# - alphagenome
#  - run_vep
  - liftover
  #- var_annot

liftover:
  from_build: hg19
  to_build: hg38
  output: test/



# ---------------------------------------------------------------------------
# Alphagenome bulk score
# ---------------------------------------------------------------------------
variants: /storage/mathelierarea/processed/eirikhoy/action_var/data/BRCA1_BRCA2_PALB2_varianter_2025_02_10.csv
vcf: /storage/mathelierarea/processed/eirikhoy/action_var/results/clinical_gene_variants.vcf
scores: /storage/mathelierarea/processed/eirikhoy/action_var/results/clinical_gene_scores.csv


# ---------------------------------------------------------------------------
# Annotate ExpectoSC variants
# ---------------------------------------------------------------------------
GRCh37_url: https://ftp.ensembl.org/pub/grch37/current/gtf/homo_sapiens/Homo_sapiens.GRCh37.87.gtf.gz
GRCh37_path: resources/Homo_sapiens.GRCh37.87.gtf.gz
#expecto_scores: /storage/mathelierarea/processed/eirikhoy/action_var/data/eirik/Seqweaver_bridges__breast.csv
expecto_scores: /storage/mathelierarea/processed/eirikhoy/action_var/workflow/notebooks/concordant_variants_breast_epithelial.csv
expecto_runfile: /storage/mathelierarea/processed/eirikhoy/action_var/data/eirik/Seqweaver_bridges34_genes_input.RUNFILE.csv
#annotated_variants: /storage/mathelierarea/processed/eirikhoy/action_var/results/expecto_annotated_variants.csv
annotated_variants: /storage/mathelierarea/processed/eirikhoy/action_var/results/expecto_annotated_concordant_breast_epithelial_variants.csv
z_threshold: 2.0