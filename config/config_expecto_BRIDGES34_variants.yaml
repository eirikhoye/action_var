# ---------------------------------------------------------------------------
# Input variants
# ---------------------------------------------------------------------------
variants: /storage/mathelierarea/processed/eirikhoy/action_var/data/eirik/Seqweaver_bridges34_genes_input.RUNFILE.csv
variants_build: hg19

# ---------------------------------------------------------------------------
# Modules to run
# ---------------------------------------------------------------------------
modules:
  - annotate_vep

# ---------------------------------------------------------------------------
# Liftover (optional overrides)
# ---------------------------------------------------------------------------
liftover:
  output: test/expecto_bridges_data/bridges_34_genes_hg38.csv
  columns:
    id: SNP
    chrom: chrom
    pos: snp_chromStart
    ref: ref
    alt: alt
  # Other coordinate columns to lift (<position col>: <chromosome col>)
  extra_pos_columns:
    snp_chromEnd: chrom
    tss: chrom_gene
    tss_chromEnd: chrom_gene

vep:
  output: test/expecto_bridges_data/bridges_34_genes_vep.vcf
  report: 
    output: test/expecto_bridges_data/vep_report.html
    genes: [ABRAXAS1, AKT1, ATM, BABAM2, BARD1, BRCA1, BRCA2, BRIP1, CDH1,
            CHEK2, EPCAM, FANCC, FANCM, GEN1, MEN1, MLH1, MRE11, MSH2, MSH6,
            MUTYH, NBN, NF1, PALB2, PIK3CA, PMS2, PTEN, RAD50, RAD51C,
            RAD51D, RECQL, RINT1, STK11, TP53, XRCC2]
    gtf: https://storage.googleapis.com/alphagenome/reference/gencode/hg38/gencode.v46.annotation.gtf.gz.feather